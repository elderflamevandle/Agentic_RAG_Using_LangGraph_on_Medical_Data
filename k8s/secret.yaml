# =============================================================================
# Secret — API keys
# =============================================================================
# Contains all sensitive credentials.
# stringData accepts plain-text values; Kubernetes base64-encodes them
# automatically before storing.
#
# !! NEVER commit real key values to version control !!
# Replace every REPLACE_WITH_REAL_* placeholder before applying.
#
# Production alternative — IAM Roles for Service Accounts (IRSA):
#   If your EKS node group / pod already carries an IAM role that grants S3
#   access, remove AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from this
#   Secret and from the envFrom blocks in deployment.yaml / cronjob.yaml.
#   IRSA is the recommended approach for EKS because it avoids long-lived
#   static credentials entirely.
#
# Apply:  kubectl apply -f k8s/secret.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: agentic-rag-secret
  namespace: agentic-rag
  labels:
    app.kubernetes.io/name: agentic-rag
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # ── LLM / Search API keys ──────────────────────────────────────────────────
  GROQ_API_KEY: "REPLACE_WITH_REAL_GROQ_API_KEY"
  SERPER_API_KEY: "REPLACE_WITH_REAL_SERPER_API_KEY"

  # ── AWS credentials (used by dataset-loader init container for S3 sync) ───
  # Remove these two entries if you are using IRSA instead.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_REAL_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_REAL_AWS_SECRET_ACCESS_KEY"
